<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vogue Boutique - Fashion & Minimalist Luxury Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#FAF9F6] text-slate-900 antialiased selection:bg-black selection:text-white">
  <!-- Announcement Bar -->
  <div class="bg-black text-white text-[11px] font-semibold text-center py-2 tracking-widest uppercase">
    Miễn phí vận chuyển toàn quốc cho đơn hàng từ 1.000.000đ • BST MÙA THU 2026
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#FAF9F6]/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <nav class="hidden md:flex items-center gap-8 text-xs font-semibold uppercase tracking-widest text-slate-600">
        <a href="#new" class="hover:text-black">Hàng mới</a>
        <a href="#collection" class="hover:text-black">Bộ sưu tập</a>
        <a href="#editorial" class="hover:text-black">Lookbook</a>
      </nav>
      <div class="text-2xl font-serif font-black tracking-tight text-center">
        VOGUE<span class="text-xs font-sans font-light tracking-widest block uppercase text-slate-500">Boutique</span>
      </div>
      <div class="flex items-center gap-4 text-xs font-bold uppercase tracking-wider">
        <button class="hover:underline">Tìm kiếm</button>
        <button class="px-4 py-2 bg-black text-white rounded-full">Giỏ hàng (0)</button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="relative h-[75vh] flex items-center justify-center overflow-hidden">
    <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80" alt="Fashion Hero" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/35 backdrop-blur-[1px]"></div>
    <div class="relative z-10 text-center text-white px-6 max-w-2xl">
      <span class="text-xs font-bold tracking-[0.3em] uppercase mb-4 block text-amber-200">Bộ Sưu Tập Mới 2026</span>
      <h1 class="text-4xl sm:text-6xl font-serif font-bold mb-6">Nghệ Thuật Của Sự Tối Giản</h1>
      <p class="text-sm sm:text-base text-slate-200 mb-8 font-light">Chất liệu hữu cơ tự nhiên, phom dáng thanh lịch dành cho quý cô hiện đại.</p>
      <button class="px-8 py-3.5 bg-white text-black font-bold text-xs uppercase tracking-widest hover:bg-black hover:text-white transition-all shadow-xl">
        Khám phá ngay
      </button>
    </div>
  </section>
</body>
</html>
